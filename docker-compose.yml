services:
  backend:
    build:
      context: ./api_backend
      dockerfile: Dockerfile
    container_name: parcial_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./api_backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-change-in-prod}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-True}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ai_discovery_net

  frontend:
    build:
      context: ./parcial_front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: parcial_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default

networks:
  default:
  ai_discovery_net:
    name: backend_default
    external: true
